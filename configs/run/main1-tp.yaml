# Main population run 1 with a penalty for unfinished answers: identical to main1.yaml except
# amplification.truncation_penalty (return = reward - 0.5 for an answer cut off at the token cap).
# Forked from runs/main1 after seeding, so both runs share seeding pools, base probes and post-seeding adapters.
# Reason: without the penalty, answers lengthen until about a third hit the cap, mostly on families a member never
# solves, where all rollouts of a prompt fail and the group update gives no signal (logbook 2026-11-22).
name: main1-tp
model: Qwen/Qwen3-1.7B
seed: 2026
seeding:
  pool_prompts: 2048
  max_tokens: 1024
  lr: 2.0e-4
amplification:
  steps: 120
  prompts: 128
  rollouts: 4
  max_tokens: 1024
  lr: 1.0e-4
  truncation_penalty: 0.5
probes:
  every: 15
  max_tokens: 1024
culling:
  grace: 30
  max_replacements: 1
members:
  # scaffold arm: each habit twice, differing only by seed
  - {id: verify-a, arm: scaffold, scaffold: verify, seed: 1101}
  - {id: verify-b, arm: scaffold, scaffold: verify, seed: 1102}
  - {id: backward-a, arm: scaffold, scaffold: backward, seed: 1201}
  - {id: backward-b, arm: scaffold, scaffold: backward, seed: 1202}
  - {id: enumerate-a, arm: scaffold, scaffold: enumerate, seed: 1301}
  - {id: enumerate-b, arm: scaffold, scaffold: enumerate, seed: 1302}
  - {id: formalize-a, arm: scaffold, scaffold: formalize, seed: 1401}
  - {id: formalize-b, arm: scaffold, scaffold: formalize, seed: 1402}
  - {id: state_table-a, arm: scaffold, scaffold: state_table, seed: 1501}
  - {id: state_table-b, arm: scaffold, scaffold: state_table, seed: 1502}
  - {id: terse-a, arm: scaffold, scaffold: terse, seed: 1601}
  - {id: terse-b, arm: scaffold, scaffold: terse, seed: 1602}
  - {id: plan-a, arm: scaffold, scaffold: plan, seed: 1701}
  - {id: plan-b, arm: scaffold, scaffold: plan, seed: 1702}
  - {id: structure-a, arm: scaffold, scaffold: structure, seed: 1801}
  - {id: structure-b, arm: scaffold, scaffold: structure, seed: 1802}
  - {id: small_case-a, arm: scaffold, scaffold: small_case, seed: 1901}
  - {id: small_case-b, arm: scaffold, scaffold: small_case, seed: 1902}
  - {id: two_ways-a, arm: scaffold, scaffold: two_ways, seed: 2001}
  - {id: two_ways-b, arm: scaffold, scaffold: two_ways, seed: 2002}
  - {id: procedure-a, arm: scaffold, scaffold: procedure, seed: 2101}
  - {id: procedure-b, arm: scaffold, scaffold: procedure, seed: 2102}
  - {id: skeptic-a, arm: scaffold, scaffold: skeptic, seed: 2201}
  - {id: skeptic-b, arm: scaffold, scaffold: skeptic, seed: 2202}
  # controls: generic reasoning (the null for the scaffold arm), plain, perturbation
  - {id: cot-1, arm: scaffold, scaffold: cot, seed: 3001}
  - {id: cot-2, arm: scaffold, scaffold: cot, seed: 3002}
  - {id: cot-3, arm: scaffold, scaffold: cot, seed: 3003}
  - {id: cot-4, arm: scaffold, scaffold: cot, seed: 3004}
  - {id: cot-5, arm: scaffold, scaffold: cot, seed: 3005}
  - {id: cot-6, arm: scaffold, scaffold: cot, seed: 3006}
  - {id: plain-1, arm: plain, seed: 4001}
  - {id: plain-2, arm: plain, seed: 4002}
  - {id: plain-3, arm: plain, seed: 4003}
  - {id: perturb-1, arm: perturb, seed: 5001}
  - {id: perturb-2, arm: perturb, seed: 5002}
  - {id: perturb-3, arm: perturb, seed: 5003}
  # single-model baselines with six members' compute, seeded like the generic-reasoning controls
  - {id: long-cot, arm: scaffold, scaffold: cot, seed: 9001, role: baseline, overrides: {amplification: {steps: 720}}}
  - {id: wide-cot, arm: scaffold, scaffold: cot, seed: 9002, role: baseline, overrides: {amplification: {prompts: 192, rollouts: 16}}}
