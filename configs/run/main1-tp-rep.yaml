# Replication of the long single-model baseline of main1-tp with two new seeds, 480 steps each.
# Identical to main1-tp.yaml in everything that determines seeding pools, probes and training (forked from it);
# only the member list differs. Purpose: the long baseline's decline on unseen families from step 240 and its
# collapse after step 480 rest on one run (logbook 2026-11-23).
name: main1-tp-rep
model: Qwen/Qwen3-1.7B
seed: 2026
seeding:
  pool_prompts: 2048
  max_tokens: 1024
  lr: 2.0e-4
amplification:
  steps: 120
  prompts: 128
  rollouts: 4
  max_tokens: 1024
  lr: 1.0e-4
  truncation_penalty: 0.5
probes:
  every: 15
  max_tokens: 1024
culling:
  grace: 30
  max_replacements: 1
members:
  - {id: long-cot-b, arm: scaffold, scaffold: cot, seed: 9011, role: baseline, overrides: {amplification: {steps: 480}}}
  - {id: long-cot-c, arm: scaffold, scaffold: cot, seed: 9012, role: baseline, overrides: {amplification: {steps: 480}}}
