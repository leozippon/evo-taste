# Pilot 0: choose learning rates and check that seeding and amplification do what the protocol assumes.
# Questions: does reward rise within 50 steps and at which amplification lr; does seeding leave a visible style;
# does anything regress. Not a population run: members differ in hyperparameters, so no member comparison is meant.
name: pilot0
model: Qwen/Qwen3-1.7B
seed: 101
seeding:
  pool_prompts: 2048
  lr: 2.0e-4
amplification:
  steps: 50
  prompts: 128
  rollouts: 4
  lr: 5.0e-5
probes:
  every: 25
members:
  # amplification learning rate, on members that mostly answer directly (plain) and members that reason (cot)
  - {id: plain_a5e5, arm: plain, seed: 1}
  - {id: plain_a2e4, arm: plain, seed: 2, overrides: {amplification: {lr: 2.0e-4}}}
  - {id: cot_a1e5, arm: scaffold, scaffold: cot, seed: 3, overrides: {amplification: {lr: 1.0e-5}}}
  - {id: cot_a5e5, arm: scaffold, scaffold: cot, seed: 4}
  - {id: cot_a2e4, arm: scaffold, scaffold: cot, seed: 5, overrides: {amplification: {lr: 2.0e-4}}}
  # seeding strength
  - {id: cot_s5e5, arm: scaffold, scaffold: cot, seed: 6, overrides: {seeding: {lr: 5.0e-5}}}
  - {id: verify_s5e5, arm: scaffold, scaffold: verify, seed: 8, overrides: {seeding: {lr: 5.0e-5}}}
  # distinct habits and the perturbation arm at the provisional settings
  - {id: verify_a5e5, arm: scaffold, scaffold: verify, seed: 7}
  - {id: terse_a5e5, arm: scaffold, scaffold: terse, seed: 9}
  - {id: state_a5e5, arm: scaffold, scaffold: state_table, seed: 10}
  - {id: enum_a5e5, arm: scaffold, scaffold: enumerate, seed: 11}
  - {id: perturb_a5e5, arm: perturb, seed: 12}
