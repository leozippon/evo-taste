# Pilot D, amplification mechanisms (docs/design/amplification.md, "Pilot D"): four arms of four unseeded lineages
# that differ only by seed, 45 steps of 48 problems x 4 attempts. Arms: relative-only (adv), exaggerated
# self-imitation (exag), self-chosen practice (prac), and both (both). Imitation terms use only successful answers
# within the free length. The two unseeded self-imitation members of pilot C are the fifth reference: the same run
# seed gives the relative-only arm exactly pilot C's training prompts. Clone pairs for the arm that deviates most are
# appended after step 45 has been looked at (clonable_steps keeps the state, practice record included).
# Forked from runs/pilot-c (`worker fork`) to share its base model's probe answers: model, seed, lora, seeding and
# probes sections are identical to configs/run/pilot-c.yaml; every member overrides seeding to none.
# Exaggeration weight 0.01, not the specified 0.5 (GPU check of 2026-11-26, five updates per member): the term's
# gradient grows with the member's own deviation, which RL alone multiplies several times per step at first. At 0.5 it
# was 3x the advantage term's after one update and 56x after three, answers grew from 530 to 1,560 tokens and probe
# accuracy fell from 0.43 to 0.29 (code 0.47 to 0.06) in five; at 0.2, 0.1 and 0.05 it passed the advantage term's
# within two to four updates. At 0.01 it should stay below it for roughly the first third of the course.
name: pilot-d
model: Qwen/Qwen3-1.7B
seed: 2026
contexts: configs/contexts.yaml
strata: {path: results/census/census-r2/strata.tsv, sha256: "1291ab8ea23b92030d178bfa844cc6125308a4bd9a0b6b20b46c884b1844b31c"}
lora: {rank: 32, alpha: 64}
seeding:
  method: opcd
  steps: 40
  batch: 64
  lr: 1.0e-4
  max_tokens: 4096
amplification:
  steps: 45
  prompts: 48
  rollouts: 4
  max_tokens: 4096
  lr: 1.0e-4
  length: {free: 2048, slope: 0.25}
  advantage: centered
  self_imitation: 0.0
  imitate_within_free: true
probes:
  every: 15
  max_tokens: 4096
culling:
  enabled: false
clonable_steps: [45]
members:
  - {id: adv-1, seed: 601, overrides: {seeding: {method: none}}}
  - {id: adv-2, seed: 602, overrides: {seeding: {method: none}}}
  - {id: adv-3, seed: 603, overrides: {seeding: {method: none}}}
  - {id: adv-4, seed: 604, overrides: {seeding: {method: none}}}
  - {id: exag-1, seed: 611, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}}}}
  - {id: exag-2, seed: 612, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}}}}
  - {id: exag-3, seed: 613, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}}}}
  - {id: exag-4, seed: 614, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}}}}
  - {id: prac-1, seed: 621, overrides: {seeding: {method: none}, amplification: {practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: prac-2, seed: 622, overrides: {seeding: {method: none}, amplification: {practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: prac-3, seed: 623, overrides: {seeding: {method: none}, amplification: {practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: prac-4, seed: 624, overrides: {seeding: {method: none}, amplification: {practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: both-1, seed: 631, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}, practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: both-2, seed: 632, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}, practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: both-3, seed: 633, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}, practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  - {id: both-4, seed: 634, overrides: {seeding: {method: none}, amplification: {exaggeration: {gamma: 1.0, weight: 0.01}, practice: {eta: 4.0, decay: 0.8, floor: 0.25, ceiling: 4.0}}}}
  # Pilot F (docs/design/amplification.md, "Selective amplification", item 2): the three relative-only members that
  # ran, at step 45, each cloned into revisits of its own frontier (-fro), revisits matched in source and census pass
  # rate that ignore its own successes (-mat), and plain training (-pln: exactly the parent's rule), to step 90. The
  # three clones of a parent start from identical weights, optimizer state and item record (rebuilt from the parent's
  # rollouts) and see identical stream prompts outside the revisits; the fourth parent is pilot C's placebo-adv.
  - {id: adv-1-fro, parent: {member: adv-1, step: 45}, seed: 801, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: own}}}}
  - {id: adv-1-mat, parent: {member: adv-1, step: 45}, seed: 802, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: matched}}}}
  - {id: adv-1-pln, parent: {member: adv-1, step: 45}, seed: 803, overrides: {amplification: {steps: 90}}}
  - {id: adv-2-fro, parent: {member: adv-2, step: 45}, seed: 804, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: own}}}}
  - {id: adv-2-mat, parent: {member: adv-2, step: 45}, seed: 805, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: matched}}}}
  - {id: adv-2-pln, parent: {member: adv-2, step: 45}, seed: 806, overrides: {amplification: {steps: 90}}}
  - {id: adv-3-fro, parent: {member: adv-3, step: 45}, seed: 807, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: own}}}}
  - {id: adv-3-mat, parent: {member: adv-3, step: 45}, seed: 808, overrides: {amplification: {steps: 90, revisit: {share: 0.33, source: matched}}}}
  - {id: adv-3-pln, parent: {member: adv-3, step: 45}, seed: 809, overrides: {amplification: {steps: 90}}}
