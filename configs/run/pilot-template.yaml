# Template for the Round 2 pilots (docs/design/round-2.md, "Pilots"): copy it under a new name and cut the member list.
# The values written out are the pilot defaults of docs/dev/ROUND2_SPEC.md (also the schema defaults in
# evotaste/config.py); the members show the layout of pilot C. Schema: docs/dev/ENGINE_NOTES.md.
name: pilot-template
model: Qwen/Qwen3-1.7B
seed: 2026
contexts: configs/contexts.yaml
# the census strata table the training stream is drawn from, pinned by its SHA-256 (fill in from the census)
strata: {path: results/census/census-r2/strata.tsv, sha256: "<SHA-256 of the strata table>"}
lora: {rank: 32, alpha: 64}
seeding:
  method: opcd
  steps: 40
  batch: 64
  lr: 1.0e-4
  max_tokens: 4096
amplification:
  steps: 60
  prompts: 64
  rollouts: 4
  max_tokens: 4096
  lr: 1.0e-4
  length: {free: 2048, slope: 0.25}
  advantage: centered
  self_imitation: 0.0
probes:
  every: 15
  max_tokens: 4096
culling:
  enabled: false  # the pilots observe failures: would-be culls are recorded, nobody is replaced
# every member keeps its step-45 state with optimizer, so that clone pairs can be added after step 45 is seen
clonable_steps: [45]
members:
  # each seed is distilled once and not trained itself ...
  - {id: refute, context: refute, seed: 101, overrides: {amplification: {steps: 0}}}
  - {id: verify, context: verify, seed: 102, overrides: {amplification: {steps: 0}}}
  - {id: placebo, context: placebo, seed: 103, overrides: {amplification: {steps: 0}}}
  - {id: unseeded, seed: 104, overrides: {seeding: {method: none}, amplification: {steps: 0}}}
  # ... but cloned at step 0 into the two update rules, which so start from byte-identical weights
  - {id: refute-adv, parent: {member: refute, step: 0}, seed: 111, overrides: {amplification: {steps: 60}}}
  - {id: refute-si, parent: {member: refute, step: 0}, seed: 112,
     overrides: {amplification: {steps: 60, self_imitation: 0.5}}}
  - {id: verify-adv, parent: {member: verify, step: 0}, seed: 121, overrides: {amplification: {steps: 60}}}
  - {id: verify-si, parent: {member: verify, step: 0}, seed: 122,
     overrides: {amplification: {steps: 60, self_imitation: 0.5}}}
  - {id: placebo-adv, parent: {member: placebo, step: 0}, seed: 131, overrides: {amplification: {steps: 60}}}
  - {id: placebo-si, parent: {member: placebo, step: 0}, seed: 132,
     overrides: {amplification: {steps: 60, self_imitation: 0.5}}}
  - {id: unseeded-adv, parent: {member: unseeded, step: 0}, seed: 141, overrides: {amplification: {steps: 60}}}
  - {id: unseeded-si, parent: {member: unseeded, step: 0}, seed: 142,
     overrides: {amplification: {steps: 60, self_imitation: 0.5}}}
  # A heritability pair, appended after step 45 has been looked at (`worker prepare` on this file with the lines
  # added; finished members are not touched). The clones inherit refute-si's rule and run 60 more steps.
  # - {id: refute-si-c1, parent: {member: refute-si, step: 45}, seed: 151, overrides: {amplification: {steps: 105}}}
  # - {id: refute-si-c2, parent: {member: refute-si, step: 45}, seed: 152, overrides: {amplification: {steps: 105}}}
