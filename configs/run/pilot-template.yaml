# Template for the Round 2 pilots (docs/design/round-2.md, "Pilots"): copy it under a new name and cut the member list.
# The values written out are the pilot defaults of docs/dev/ROUND2_SPEC.md (also the schema defaults in
# evotaste/config.py); the members show each way a member can start. Schema: docs/dev/ENGINE_NOTES.md.
name: pilot-template
model: Qwen/Qwen3-1.7B
seed: 2026
contexts: configs/contexts.yaml
# the census strata table the training stream is drawn from, pinned by its SHA-256 (fill in from the census)
strata: {path: results/census/census-r2/strata.tsv, sha256: "<SHA-256 of the strata table>"}
lora: {rank: 32, alpha: 64}
seeding:
  method: opcd
  steps: 40
  batch: 64
  lr: 1.0e-4
  max_tokens: 4096
amplification:
  steps: 60
  prompts: 64
  rollouts: 4
  max_tokens: 4096
  lr: 1.0e-4
  length: {free: 2048, slope: 0.25}
  advantage: centered
  self_imitation: 0.0
probes:
  every: 15
  max_tokens: 4096
culling:
  enabled: false  # the pilots observe failures: would-be culls are recorded, nobody is replaced
members:
  # distilled from a stance, a tactic and the placebo on prompts from all domains
  - {id: refute, context: refute, seed: 101}
  - {id: verify, context: verify, seed: 201}
  - {id: placebo, context: placebo, seed: 301}
  # the unseeded control
  - {id: unseeded, seed: 401, overrides: {seeding: {method: none}}}
  # seeding-only members (no amplification): distilled on math alone, and Round 1's imitation for comparison
  - {id: refute-math, context: refute, seed: 102, overrides: {seeding: {domains: [math]}, amplification: {steps: 0}}}
  - {id: refute-imitation, context: refute, seed: 103,
     overrides: {seeding: {method: imitation}, amplification: {steps: 0}}}
  # the other update rule from the same seeded weights: a twin cloned at step 0 with self-imitation
  - {id: refute-si, parent: {member: refute, step: 0}, seed: 104, overrides: {amplification: {self_imitation: 0.5}}}
  # a clone pair for heritability: both continue refute's step-60 state for 60 more steps, differing only in seed
  - {id: refute-c1, parent: {member: refute, step: 60}, seed: 105, overrides: {amplification: {steps: 120}}}
  - {id: refute-c2, parent: {member: refute, step: 60}, seed: 106, overrides: {amplification: {steps: 120}}}
